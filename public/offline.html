<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>디에듀 · 연결 끊김</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9f9f9; color: #1a1a1a; font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
      main { padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #555; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #ff4805; color: #fff; font-size: 16px; font-weight: 700; }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결이 끊겼어요</h1>
      <p>연결되면 다시 시도를 눌러 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
